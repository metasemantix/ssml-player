name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android command-line tools and SDK
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/ssml-android-sdk"
          cli_zip="$RUNNER_TEMP/android-cli.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip --output "$cli_zip"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $cli_zip" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$cli_zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/19.0"
          sdkmanager="$sdk_root/cmdline-tools/19.0/bin/sdkmanager"
          # yes exits on SIGPIPE when sdkmanager finishes; preserve sdkmanager's status.
          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint, and installable debug APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK signature and offline permissions
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > /tmp/ssml-permissions.txt
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' /tmp/ssml-permissions.txt; then
            echo "Unexpected network permission in APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ssml-player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
